<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %} {% endblock %} | blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #a5b4fc;"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Blog
    </a>
    <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto ps-lg-4">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('new_blog')}}">New Blog</a></li>
        <li class="nav-item"><a class="nav-link" href="{{url_for('my_blogs')}}">My Blogs</a></li>
      </ul>

      <form action="/search" method="get" class="d-flex me-3">
        <div class="input-group">
          <input class="form-control border-end-0 bg-transparent text-white" style="backdrop-filter: blur(10px);" name="search_blog" placeholder="Search blogs...">
          <button class="btn btn-outline-light border-start-0" style="background: rgba(15, 23, 42, 0.6);">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>
      </form>

      <ul class="navbar-nav">
        {% if session.get('user_id') %}
         <li class="nav-item d-flex align-items-center me-3">
           <span class="text-white small">Welcome, <strong class="text-white">{{ session.get('username') }}</strong></span>
         </li>
         <li class="nav-item"><a class="nav-link" href="{{url_for('logout')}}">Logout</a></li>
        {% else %}
         <li class="nav-item"><a class="nav-link" href="{{url_for('signin')}}">Sign In</a></li>
         <li class="nav-item ms-2"><a class="btn btn-primary btn-sm px-3 mt-1" href="{{url_for('register')}}">Register</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="page-container">
  {% block content %} {% endblock %}
</div>

<footer class="mt-auto py-4 text-center text-white" style="background: rgba(15, 23, 42, 0.4); border-top: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px);">
  <div class="container">
    <small>&copy; 2026 blog. All rights reserved.</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
