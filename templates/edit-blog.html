{% extends "base.html" %}

{% block title %} Edit Story {% endblock %}

{% block content %}
<div class="container mt-5 mb-5" style="max-width: 700px;">
  <div class="mb-5">
    <h2 class="display-6 fw-bold text-white mb-2">Edit Story</h2>
    <p class="text-white">Make changes to your published article.</p>
  </div>

  <div class="card border-0 shadow-lg" style="background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(16px);">
    <div class="card-body p-4 p-md-5">
      <form action="/update-blog/{{blogs[0]}}" method="post">

        <div class="mb-4">
          <label class="form-label text-white-50 fw-semibold">Story Title</label>
          <input type="text" name="title"
            class="form-control form-control-lg bg-transparent text-white border-secondary border-opacity-50"
            value="{{blogs[1]}}" required>
        </div>

        <div class="mb-4">
          <label class="form-label text-white-50 fw-semibold">Cover Image URL</label>
          <div class="d-flex gap-3 align-items-center">
            <input type="url" name="image"
              class="form-control bg-transparent text-white border-secondary border-opacity-50" value="{{blogs[2]}}"
              required>
            <img src="{{blogs[2]}}" alt="Current Cover" class="rounded object-fit-cover shadow-sm"
              style="width: 72px; height: 48px; border: 1px solid rgba(255,255,255,0.1);">
          </div>
        </div>

        <div class="mb-5">
          <label class="form-label text-white-50 fw-semibold">Story Content</label>
          <textarea class="form-control bg-transparent text-white border-secondary border-opacity-50" name="description"
            rows="12" required>{{blogs[3]}}</textarea>
        </div>

        <div class="d-flex justify-content-end gap-3 pt-4 border-top border-secondary border-opacity-25">
          <a href="{{url_for('my_blogs')}}" class="btn btn-outline-light rounded-pill px-4">Cancel</a>
          <button class="btn btn-success rounded-pill px-5 shadow" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
