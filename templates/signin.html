{% extends "base.html" %}

{% block title %} Sign In {% endblock %}

{% block content %}
<div class="container auth-container mb-5">
  <div class="auth-card text-center">
    <div class="mb-4">
      <div
        class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3 p-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" x2="3" y1="12" y2="12" />
        </svg>
      </div>
      <h3 class="fw-bold text-white mb-2">Welcome Back</h3>
      <p class="text-white small">Sign in to continue to NexusBlog</p>
    </div>

    <form action="signin" method="post" class="text-start">
      <div class="mb-3">
        <label class="form-label small text-white-50">Email Address</label>
        <div class="position-relative">
          <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </span>
          <input type="email" class="form-control ps-5 bg-transparent text-white border-secondary border-opacity-50"
            placeholder="you@example.com" name="email" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small text-white-50 d-flex justify-content-between">
          Password
          <a href="#" class="text-primary text-decoration-none">Forgot?</a>
        </label>
        <div class="position-relative">
          <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" class="form-control ps-5 bg-transparent text-white border-secondary border-opacity-50"
            placeholder="••••••••" name="password" required>
        </div>
      </div>

      <button class="btn btn-primary w-100 py-2 rounded-8 mb-4 shadow" type="submit">Sign In</button>

      <div class="text-center">
        <span class="text-white small">Don't have an account?</span>
        <a href="{{url_for('register')}}" class="text-primary text-decoration-none fw-medium small ms-1">Create one</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
